
[PHP]
expose_php = Off
display_errors = On
log_errors = On
error_reporting = E_ALL

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20

date.timezone = America/Sao_Paulo

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

